version: '3.7'

networks:
  cssninja-services:
    external: true

services:
  apollux-demo:
    image: digisquad/cssninja.apollux-demo:latest
    restart: 'unless-stopped'
    networks:
      - cssninja-services
    environment:
      - NUXT_PUBLIC_SITE_URL=${NUXT_PUBLIC_SITE_URL}
      - NUXT_PUBLIC_MAPBOX_TOKEN=${NUXT_PUBLIC_MAPBOX_TOKEN}
    labels:
      traefik.enable: true
      traefik.docker.network: 'cssninja-services'
      traefik.http.routers.apollux-demo.entrypoints: 'http'
      traefik.http.routers.apollux-demo.rule: 'Host(`${PUBLIC_HOST}`)'
      traefik.http.routers.apollux-demo.middlewares: 'https-redirect@file'
      traefik.http.services.apollux-demo-https.loadbalancer.server.port: 3000
      traefik.http.routers.apollux-demo-https.rule: 'Host(`${PUBLIC_HOST}`)'
      traefik.http.routers.apollux-demo-https.tls: true
      traefik.http.routers.apollux-demo-https.entrypoints: 'https'
      traefik.http.routers.apollux-demo-https.tls.certresolver: 'http'
      traefik.http.routers.apollux-demo-https.middlewares: apollux-middleware@docker
      #gzip
      traefik.http.middlewares.apollux-middleware.compress: true
